services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bocrm-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - bocrm-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/api/BusinessOperations.Api/Dockerfile
    container_name: bocrm-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BusinessOperationsCrm;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;Encrypt=False"
      Cors__Origins__0: "http://localhost:5173"
      Cors__Origins__1: "http://localhost:8081"
      SeedUsers__Admin__Email: "admin@local.dev"
      SeedUsers__Admin__Password: "ChangeMe!Admin123"
      SeedUsers__Operations__Email: "ops@local.dev"
      SeedUsers__Operations__Password: "ChangeMe!Ops123"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: bocrm-web
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  bocrm-sql-data:
