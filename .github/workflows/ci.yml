name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore BusinessOperations.sln
      - name: Build
        run: dotnet build BusinessOperations.sln --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/BusinessOperations.UnitTests/BusinessOperations.UnitTests.csproj --configuration Release --no-build
      - name: Integration tests
        run: dotnet test tests/BusinessOperations.IntegrationTests/BusinessOperations.IntegrationTests.csproj --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
